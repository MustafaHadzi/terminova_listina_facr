<html>
<head>
<style>
table {
border-collapse: collapse;
width: 100%;
color: #333;
font-family: Helvetica;
font-size: 12px;
text-align: left;
border-radius: 10px;
overflow: hidden;
box-shadow: 0 0 20px;
margin: auto;
margin-top: 50px;
margin-bottom: 50px;
}
th {
background-color: #666666;
color: #ffffff;
font-weight: bold;
padding: 5px;
text-transform: uppercase;
letter-spacing: 1px;
border-top: 1px solid #fff;
border-bottom: 1px solid #ccc;
text-align: left;
}
tr:nth-child(even) td {
background-color:#e0e0e0;
}
tr:hover td {
background-color: #999;
}
td {
background-color: #fff;
padding: 5px;
border: 1px solid #ccc;
font-weight: bold;
}
</style>
</head>
<body>
<table class="dataframe">
  <thead>
    <tr style="text-align: right;">
      <th>Datum</th>
      <th>Utkání</th>
      <th>Skóre</th>
      <th>Hřiště</th>
      <th>Poznámka</th>
      <th>Soutěž</th>
    </tr>
  </thead>
  <tbody>
  </tbody>
</table></table></body></html>
